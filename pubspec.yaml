name: finvexa
description: "Comparação, auditoria e relatórios financeiros FinVexa."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.7

dependencies:
  http: ^1.6.0
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  file_picker: 8.3.7
  pdf: ^3.13.1
  printing: ^5.15.1
  csv: 6.0.0
  shared_preferences: ^2.5.6
  excel_plus: ^2.29.2
  pdfrx: ^2.12.0
  fl_chart: ^1.3.0
  crypto: ^3.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.14.4
  image: ^4.12.0

flutter:
  uses-material-design: true
  fonts:
    - family: NotoSans
      fonts:
        - asset: assets/fonts/NotoSans-Regular.ttf
        - asset: assets/fonts/NotoSans-Bold.ttf
          weight: 700
  assets:
    - assets/branding/finvexa.png
    - assets/fonts/NotoSans-Regular.ttf
    - assets/fonts/NotoSans-Bold.ttf